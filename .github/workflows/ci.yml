name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Single source of truth for the toolchain version, shared with
          # package.json's packageManager/engines fields.
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # No PINKY_INTEGRATION here, so the integration files report as skipped
      # and this job needs no services at all.
      - run: bun test

  integration:
    name: integration tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: check

    strategy:
      fail-fast: false
      matrix:
        # Both images ON PURPOSE. pgvector is the only place the vector voice,
        # 0002_embeddings.rerun.sql's ALTER TABLE and the HNSW index actually
        # execute; alpine (what docker-compose.yml runs locally) is where the
        # `supportsVectors() === false` degradation branch — FTS-only recall,
        # retain without an embedding — is exercised. A green run needs both.
        image: ["pgvector/pgvector:pg16", "postgres:16-alpine"]

    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: pinky
          POSTGRES_DB: pinky
        ports:
          # CI publishes the stock port; local dev uses 5544 because 5432 is
          # usually taken. Every test reads the url from loadEnvConfig(), so
          # the only thing that changes between them is the env below.
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pinky"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:pinky@localhost:5432/pinky
      # migrate() needs DDL + CREATE ROLE; the same superuser here, and the
      # value rls.test.ts and migrate.test.ts read for their admin connection.
      DATABASE_ADMIN_URL: postgres://postgres:pinky@localhost:5432/pinky
      # The unprivileged role migration 0003 creates — rls.test.ts connects as
      # this to prove the policy actually bites.
      PINKY_TEST_APP_URL: postgres://pinky_app:pinky@localhost:5432/pinky

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run migrate

      # migrate.test.ts and memory.test.ts assert the pgvector branch when the
      # server has the extension and the degradation branch when it does not,
      # so each matrix leg proves a different half of the memory plane.
      - run: bun run test:integration
